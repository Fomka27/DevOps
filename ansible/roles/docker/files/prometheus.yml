global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'monitoring_servers'
    static_configs:
      - targets: ['10.0.1.250:9100']

  - job_name: 'web_server'
    static_configs:
      - targets: ['10.0.1.117:9100']
  
  - job_name: 'mysql_server'
    static_configs:
      - targets: ['10.0.1.86:9100']

  - job_name: 'prometheus_container'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'grafana_container'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'loki_container'
    static_configs:
      - targets: ['loki:3100']
