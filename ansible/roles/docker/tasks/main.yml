---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: Perform apt upgrade
  ansible.builtin.apt:
    upgrade: dist
  become: true

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - gnupg
      - mc
    state: present

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository to apt sources
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo \"$VERSION_CODENAME\") stable" > /etc/apt/sources.list.d/docker.list
  args:
    executable: /bin/bash

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
    state: latest
    update_cache: yes

- name: Start and enable Docker
  systemd:
    name: docker
    enabled: yes
    state: started


- name: Install Docker Compose
  get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Create monitoring directories
  ansible.builtin.file:
    path: /monitoring/{{ item }}
    state: directory
    mode: '0755'
  loop:
    - prometheus
    - loki
    - promtail

- name: Copy Prometheus config
  ansible.builtin.copy:
    src: files/prometheus.yml
    dest: /monitoring/prometheus/prometheus.yml
    mode: '0644'

- name: Copy Loki config
  ansible.builtin.copy:
    src: files/loki-config.yml
    dest: /monitoring/loki/loki-config.yml
    mode: '0644'

- name: Copy Promtail config
  ansible.builtin.copy:
    src: files/promtail-config.yml
    dest: /monitoring/promtail/promtail-config.yml
    mode: '0644'

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: files/docker-compose.yml
    dest: /monitoring/docker-compose.yml
    mode: '0644'

- name: Run Docker Compose
  ansible.builtin.command:
    cmd: docker-compose up -d
    chdir: /monitoring/

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
    dest: /tmp/node_exporter.tar.gz

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /usr/local/bin/
    remote_src: yes

- name: Move Node Exporter binary
  ansible.builtin.command:
    cmd: mv /usr/local/bin/node_exporter-1.8.2.linux-amd64/node_exporter /usr/local/bin/node_exporter
  args:
    creates: /usr/local/bin/node_exporter

- name: Create user Node Exporter
  ansible.builtin.user:
    name: "node_exporter"
    state: present
    shell: /sbin/nologin


- name: Create Node Exporter systemd service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd to apply changes
  ansible.builtin.command: systemctl daemon-reload

- name: Start and enable Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started