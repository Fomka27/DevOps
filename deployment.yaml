apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-website
  template:
    metadata:
      labels:
        app: static-website
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: html-config
          mountPath: /usr/share/nginx/html
      volumes: # Поле volumes переміщено в template.spec
      - name: html-config
        configMap:
          name: nginx-config
