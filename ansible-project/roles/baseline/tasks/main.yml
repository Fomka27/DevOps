---
- name: Copy SSH keys
  copy:
    src: /path/to/public/key
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Install baseline packages
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - vim
    - git
    - mc
    - ufw
